name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --offline --locked
      - run: cargo test --offline --locked --release
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo doc --offline --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 tools/check_dependencies.py
