name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash .github/workflows/install-rust.sh
      - run: cargo test --offline --locked
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash .github/workflows/install-rust.sh
      - run: cargo test --offline --locked --release --verbose
        env:
          CARGO_BUILD_JOBS: 1
  arm64-release-tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash .github/workflows/install-rust.sh
      - name: Run release tests on native ARM64
        run: |
          test "$(uname -m)" = aarch64
          cargo test --offline --locked --release
        env:
          CARGO_BUILD_JOBS: 1
  check:
    needs: [debug-tests, release-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: bash .github/workflows/install-rust.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo doc --offline --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 tools/check_dependencies.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_package.py
