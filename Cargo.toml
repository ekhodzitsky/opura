[package]
name = "opura"
version = "0.2.11"
edition = "2024"
rust-version = "1.87"
description = "Opus encoder and decoder in safe Rust with zero dependencies and a WAV/Ogg Opus CLI"
repository = "https://github.com/ekhodzitsky/opura"
readme = "README.md"
keywords = ["opus", "audio", "codec", "encoder", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
license = "MIT AND BSD-2-Clause AND BSD-3-Clause"
publish = ["crates-io"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
    "/docs/audio-cli.md",
]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
