[package]
name = "opura"
version = "0.1.65"
edition = "2024"
rust-version = "1.87"
description = "A pure Rust, zero-dependency Opus decoder and baseline CELT encoder"
publish = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
